<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patil Cold | Premium Bulk Ice Cream Supplier</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0b2545;
            --royal-blue: #134074;
            --gold: #d4af37;
            --gold-light: #f4d06f;
            --bg-cream: #faf9f6;
            --text-dark: #1d2d44;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-cream); color: var(--text-dark); }
        
        /* Header */
        header { background: var(--primary-blue); border-bottom: 3px solid var(--gold); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; letter-spacing: 1px; }
        nav a { color: #fff; text-decoration: none; margin-left: 25px; font-weight: 500; transition: color 0.3s; }
        nav a:hover { color: var(--gold-light); }
        .admin-link { background: var(--gold); color: var(--primary-blue); padding: 6px 14px; border-radius: 4px; font-weight: 600; }

        /* Hero Section */
        .hero { background: linear-gradient(135deg, var(--primary-blue), var(--royal-blue)); color: #white; padding: 80px 5%; text-align: center; border-bottom: 5px solid var(--gold); }
        .hero h2 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold-light); margin-bottom: 20px; }
        .hero p { font-size: 1.2rem; max-width: 700px; margin: 0 auto 30px; color: #e2e8f0; }
        .badge { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold); color: var(--gold-light); padding: 8px 20px; border-radius: 30px; font-weight: 600; display: inline-block; margin-bottom: 15px; }

        /* Products Section */
        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--primary-blue); margin-bottom: 40px; position: relative; }
        .section-title::after { content: ''; display: block; width: 80px; height: 3px; background: var(--gold); margin: 10px auto 0; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(11,37,69,0.08); border: 1px solid rgba(212,175,55,0.3); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 200px; background: #e2e8f0; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: 500; }
        .product-info { padding: 20px; }
        .product-info h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--primary-blue); margin-bottom: 8px; }
        .product-info p { color: #64748b; font-size: 0.95rem; margin-bottom: 15px; }
        .product-price { font-size: 1.25rem; font-weight: 600; color: #b45309; }
        .bulk-tag { font-size: 0.8rem; background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 8px; font-weight: 500; }

        /* Footer */
        footer { background: var(--primary-blue); color: #fff; text-align: center; padding: 30px; border-top: 3px solid var(--gold); margin-top: 60px; font-size: 0.9rem; }
        footer p { color: var(--gold-light); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>PATIL COLD</h1>
        </div>
        <nav>
            <a href="index.html">Catalog</a>
            <a href="admin.html" class="admin-link">Admin Login</a>
        </nav>
    </header>

    <section class="hero">
        <div class="badge">EXCLUSIVE WHOLESALE & BULK SUPPLY</div>
        <h2>Pure Happiness in Bulk Tubs</h2>
        <p>Supplying premium, rich-textured bulk ice cream for events, catering businesses, and wholesale partners.</p>
    </section>

    <div class="container">
        <h2 class="section-title">Our Bulk Product Catalog</h2>
        <div id="product-list" class="products-grid">
            <!-- Products will load here automatically from Admin changes -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Patil Cold Ice Cream. All Rights Reserved. Bulk Supply Partner.</p>
    </footer>

    <script>
        // Default products if none are added yet
        const defaultProducts = [
            { name: "Royal Vanilla Bulk Tub (5L)", price: "₹650", desc: "Classic rich vanilla crafted for smooth scoops and bulk service.", image: "" },
            { name: "Rich Belgian Chocolate (5L)", price: "₹850", desc: "Deep cocoa flavor engineered for heavy commercial demand.", image: "" },
            { name: "Butterscotch Crunch (5L)", price: "₹750", desc: "Loaded with caramel crunch and premium butterscotch flavor.", image: "" }
        ];

        function loadStorefront() {
            let savedProducts = JSON.parse(localStorage.getItem('patil_products'));
            if (!savedProducts || savedProducts.length === 0) {
                savedProducts = defaultProducts;
                localStorage.setItem('patil_products', JSON.stringify(defaultProducts));
            }

            const container = document.getElementById('product-list');
            container.innerHTML = "";

            savedProducts.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">${product.image ? `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover;">` : 'Bulk Ice Cream Tub'}</div>
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.desc}</p>
                            <div class="product-price">${product.price}</div>
                            <div><span class="bulk-tag">Bulk Supply Only</span></div>
                        </div>
                    </div>
                `;
            });
        }

        loadStorefront();
    </script>
</body>
</html>
